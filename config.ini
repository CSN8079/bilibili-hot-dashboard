; 哔哩哔哩热门视频抓取配置
; 命令行参数优先于本文件；环境变量 BILIBILI_COOKIE 优先于 Cookie 配置。

[schedule]
; 抓取间隔（分钟）。程序启动后先立即抓取一次，再按此间隔运行。
interval_minutes = 10

[excel]
output_file = bilibili_hot_videos.xlsx
top_n = 100

[storage]
; 抓取后先把快照写入此队列，再尝试写 Excel。
; Excel 被占用或写入失败时，数据会保留在这里，后续自动补写。
pending_file = pending_updates.jsonl

[api]
base_url = https://api.bilibili.com/x/web-interface/ranking/v2
rid = 0
type = all
request_timeout = 20
retry_times = 3
retry_delay = 5
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36
referer = https://www.bilibili.com/v/popular/rank/all

[optional_auth]
; 公开排行榜通常不需要 Cookie。
cookie =

[dashboard]
; 启动本地服务后，可通过 http://127.0.0.1:8765/ 自动刷新查看。
enabled = true
host = 127.0.0.1
port = 8765
refresh_seconds = 10
html_file = bilibili_hot_dashboard.html
data_file = dashboard_data.json
shortcut_file = bilibili_hot_dashboard.url

[notifications]
; Excel 被占用时弹出 Windows 系统提示，提醒关闭 Excel。
enabled = true
; 相同通知的最短间隔秒数；600 表示最多每 10 分钟提示一次。
cooldown_seconds = 600

[logging]
level = INFO